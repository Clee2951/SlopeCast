[project]
name = "slopecast"
version = "0.1.0"
description = "Landslide watch: slope sensor stake, rainfall and household-aware evacuation planning"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
