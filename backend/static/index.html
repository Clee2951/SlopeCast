<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlopeCast</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="/static/styles.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
<header class="topbar">
  <div class="brand">SlopeCast</div>
  <div id="site-name" class="muted"></div>
  <div class="spacer"></div>
  <span id="mode-badge" class="badge">...</span>
  <span id="site-clock" class="muted mono"></span>
  <nav id="view-links"></nav>
</header>
<div id="offline-banner" class="offline hidden">Backend unreachable. Showing the last data received.</div>
<main id="app"><p class="muted pad">Loading...</p></main>
<script src="/static/api.js"></script>
<script>
  // load the view named in ?view= (dashboard, committee, resident)
  (function () {
    const view = SC.param("view") || (SC.token() && SC.token().startsWith("resident-") ? "resident" : "dashboard");
    const allowed = { dashboard: 1, committee: 1, resident: 1 };
    const s = document.createElement("script");
    s.src = "/static/" + (allowed[view] ? view : "dashboard") + ".js";
    document.body.appendChild(s);
    SC.renderNav(view);
  })();
</script>
</body>
</html>
